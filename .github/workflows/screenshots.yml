name: Screenshots

# Runs the app on an emulator and saves the README's screenshots and animation as an artifact.
# Start it from the Actions tab after a UI change, then copy the files into docs/screenshots.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - androidApp/src/androidTest/**
      - .github/workflows/screenshots.yml
      - .github/scripts/screenshots.sh

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app and the tour
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take the screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash .github/scripts/screenshots.sh

      - name: Scale the screenshots and make the GIF
        run: |
          mkdir -p build/screenshots/readme
          for f in build/screenshots/raw/*.png; do
            ffmpeg -loglevel error -y -i "$f" -vf scale=540:-1:flags=lanczos "build/screenshots/readme/$(basename "$f")"
          done
          ffmpeg -loglevel error -y -i build/screenshots/raw/simulate.mp4 \
            -vf "fps=15,scale=360:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" \
            build/screenshots/readme/simulate.gif
          ls -l build/screenshots/readme

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/
